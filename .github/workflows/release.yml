name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: macos-latest
            name: darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LuaJIT (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev zip

      - name: Install LuaJIT (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install luajit

      - name: Set LUAJIT_DIR for Linux
        if: runner.os == 'Linux'
        run: echo "LUAJIT_DIR=/usr" >> $GITHUB_ENV

      - name: Build
        run: make

      - name: Run tests
        run: |
          chmod +x tests/*.sh
          ./tests/run_tests.sh --compiled

      - name: Create release archive
        run: |
          mkdir -p release
          cp runtime/lune release/
          cp README.md release/
          cd release
          tar -czvf ../lune-${{ env.VERSION }}-${{ matrix.name }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lune-${{ matrix.name }}
          path: lune-${{ env.VERSION }}-${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Lune ${{ env.VERSION }}
          files: artifacts/*.tar.gz
          generate_release_notes: true
